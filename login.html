<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Exam Crunch Planner helps students organize and power through exam prep.">
  <meta name="theme-color" content="#5b8a9a">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Exam Crunch Planner</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1 class="brand">Exam Crunch Planner</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">🌙</button>
    </div>

    <div class="card">
      <h1>Welcome back</h1>
      <form id="auth-form">
        <input id="name" class="field" placeholder="Name (sign up only)" style="display:none;">
        <input id="email" class="field" type="email" placeholder="Email" required>
        <input id="password" class="field" type="password" placeholder="Password" required>
        <button type="submit" id="submit-btn" class="btn">Log in</button>
        <button type="button" id="toggle" class="btn btn-secondary">Need an account? Sign up</button>
        <button type="button" id="google-btn" class="btn btn-secondary">Continue with Google</button>
        <p id="error" class="error-text"></p>
      </form>
    </div>
  </div>

  <script type="module">
    import { signUp, logIn, googleSignIn, redirectIfLoggedIn, friendlyError } from "./js/auth.js";

    redirectIfLoggedIn();
    let isSignup = false;
    const $ = (id) => document.getElementById(id);

    $("toggle").onclick = () => {
      isSignup = !isSignup;
      $("name").style.display = isSignup ? "block" : "none";
      $("submit-btn").textContent = isSignup ? "Sign up" : "Log in";
      $("toggle").textContent = isSignup ? "Have an account? Log in" : "Need an account? Sign up";
    };

    $("auth-form").onsubmit = async (e) => {
      e.preventDefault();
      $("error").textContent = "";
      try {
        if (isSignup) await signUp($("name").value, $("email").value, $("password").value);
        else await logIn($("email").value, $("password").value);
        location.href = "dashboard.html";
      } catch (err) {
        $("error").textContent = friendlyError(err);
      }
    };

    $("google-btn").onclick = async () => {
      try {
        await googleSignIn();
        location.href = "dashboard.html";
      } catch (err) {
        $("error").textContent = friendlyError(err);
      }
    };
  </script>
</body>
</html>
